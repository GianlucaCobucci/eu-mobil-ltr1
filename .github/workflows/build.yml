name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber openpyxl tkinterdnd2 pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "EU-MOBIL-LTR1" --collect-all tkinterdnd2 extractor.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EU-MOBIL-LTR1-Windows
          path: dist/EU-MOBIL-LTR1.exe
          retention-days: 90
